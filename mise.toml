[settings]
npm.package_manager = "npm"

[tools]
bun = "latest"
node = "26"
crane = "latest"
tombi = "latest"
"github:axllent/mailpit" = "1.34.0"
rust = { version = "1.100.0", profile = "minimal", targets = ["wasm32-wasip2", "wasm32-unknown-unknown"] }
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
"github:kjanat/kprint" = "0.64.0"
"github:kjanat/envctl" = "0.7.2"
"npm:@bitwarden/cli" = "2026.11.0"

[tools."github:WebAssembly/binaryen"]
version = "133"
version_prefix = "version_"
filter_bins = ["wasm-opt"]

[tools."github:kjanat/shellcheck-rs"]
version = "latest"
asset_pattern = 'rshellcheck-*-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(linux="unknown-linux-musl", macos="apple-darwin", windows="pc-windows-msvc") }}.*'
