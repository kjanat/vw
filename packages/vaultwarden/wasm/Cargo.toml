[package]
name = "vw-password-strength"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.63.0"
zxcvbn = { version = "=3.1.1", default-features = false }

[patch.crates-io]
zxcvbn = { path = "vendor/zxcvbn" }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
