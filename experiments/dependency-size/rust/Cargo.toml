[package]
name = "vw-size-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
html5ever = { version = "=0.40.1", optional = true }
markup5ever_rcdom = { version = "=0.39.0", optional = true }
psl = { version = "=2.1.247", optional = true }
wit-bindgen = "=0.63.0"

[features]
domain = ["dep:psl"]
html = ["dep:html5ever", "dep:markup5ever_rcdom"]

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
